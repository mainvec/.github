name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately under **Security → Report a vulnerability**, not here.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Actual behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest command, configuration, or test that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and relevant tool versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, credentials, and private paths first.
      render: text
