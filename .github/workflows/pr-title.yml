name: PR title

# Reusable: call from a repo with
#   jobs: { pr-title: { uses: mainvec/.github/.github/workflows/pr-title.yml@main } }
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title follows the workflow
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          conventional='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $conventional ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(core): add thing (#42)'"
            exit 1
          fi
          needs_issue='^(feat|fix|perf|refactor)[(!:]'
          issue_ref='\(#([0-9]+)\)$'
          if [[ "$TITLE" =~ $needs_issue && ! "$TITLE" =~ $issue_ref ]]; then
            echo "::error::feat, fix, perf, and refactor titles must end with their issue, e.g. '(#42)'"
            exit 1
          fi
          if [[ "$TITLE" =~ $issue_ref ]]; then
            n="${BASH_REMATCH[1]}"
            if ! grep -Eiq "(close[sd]?|fix(e[sd])?|resolve[sd]?) #${n}([^0-9]|$)" <<<"$BODY"; then
              echo "::warning::PR body has no 'Closes #${n}'; the issue will not auto-close on merge"
            fi
          fi
